<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffea00">
<title>SHAURYA // APP HUB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap');

:root{
  --yellow:#ffe500; --pink:#ff3b9d; --cyan:#00e5ff; --purple:#7c3cff;
  --black:#101010; --white:#fffdf7; --green:#5cff5c;
  --shadow:8px 8px 0 var(--black);
  --border:3px solid var(--black);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--yellow);color:var(--black);
  font-family:"Space Mono",monospace;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;
  background-image:radial-gradient(#000 1px,transparent 1px);background-size:8px 8px;z-index:0;
}
.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:22px}
header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  border:var(--border);background:var(--white);box-shadow:var(--shadow);padding:16px 20px;
  transform:rotate(-.4deg);margin-bottom:38px;
}
.logo{font-family:"Archivo Black",sans-serif;font-size:clamp(24px,4vw,44px);letter-spacing:-2px}
.badge{background:var(--pink);border:var(--border);padding:9px 13px;font-weight:700;box-shadow:4px 4px 0 #000}
.hero{margin:40px 0 55px;max-width:850px}
.kicker{display:inline-block;background:var(--cyan);border:var(--border);padding:8px 12px;font-weight:700;box-shadow:4px 4px #000;transform:rotate(1deg)}
h1{
  font-family:"Archivo Black",sans-serif;font-size:clamp(48px,9vw,112px);
  line-height:.86;letter-spacing:-6px;margin:22px 0 20px;text-transform:uppercase;
}
.hero p{font-size:17px;max-width:650px;font-weight:700}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.card{
  background:var(--white);border:var(--border);box-shadow:var(--shadow);padding:22px;
  transition:.15s;position:relative;
}
.card:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 #000}
.card:nth-child(2){background:#e9d8ff}
.icon{
  width:112px;height:112px;border:var(--border);box-shadow:5px 5px #000;
  object-fit:cover;background:#ddd;display:block;margin-bottom:20px
}
.icon-fallback{
  display:flex;align-items:center;justify-content:center;font-family:"Archivo Black";
  font-size:36px;background:var(--cyan)
}
.app-name{font-family:"Archivo Black";font-size:35px;line-height:1;margin-bottom:8px}
.meta{font-size:12px;font-weight:700;opacity:.72;margin-bottom:18px;min-height:18px}
.download{
  display:flex;justify-content:center;align-items:center;width:100%;
  padding:15px;background:var(--black);color:#fff;text-decoration:none;
  border:var(--border);font-weight:700;cursor:pointer;font-size:15px;
  box-shadow:5px 5px 0 var(--pink);transition:.12s
}
.download:hover{background:var(--purple);box-shadow:5px 5px 0 var(--cyan)}
.download.disabled{opacity:.45;pointer-events:none}
@media(max-width:760px){
  .wrap{padding:14px}
  header{margin-bottom:25px;padding:13px}
  .badge{font-size:10px}
  h1{font-size:18vw;letter-spacing:-4px}
  .apps,.admin-grid{grid-template-columns:1fr}
  .card{padding:18px}
  .app-name{font-size:29px}
  .icon{width:92px;height:92px}
  footer{display:block;line-height:2}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">SHAURYA // HUB</div>
  <div class="badge">APP DROP 01</div>
</header>

<section class="hero">
  <span class="kicker">DOWNLOAD PORTAL / ONLINE</span>
  <h1>MY<br>APPS.</h1>
  <p>A tiny, loud, brutally clean home for the apps made by Shaurya. Pick an app. Hit download. Done.</p>
</section>

<section class="apps" id="apps"></section>


<footer><span>© SHAURYA</span><span>SIMPLE. LOUD. BRUTAL.</span></footer>
</div>

<script>
const apps = [
  { name: "Ludo King", icon: "assets/ludo-icon.jpg", file: "apps/ludo-king.apk", initials: "LK" },
  { name: "Shaurya Remote", icon: "assets/shaurya-remote-icon.png", file: "apps/shaurya-remote.apk", initials: "SR" }
];

function renderApps(){
  document.getElementById("apps").innerHTML = apps.map(app => `
    <article class="card">
      <img class="icon" src="${app.icon}" alt="${app.name} icon"
           onerror="this.outerHTML='<div class=&quot;icon icon-fallback&quot;>${app.initials}</div>'">
      <div class="app-name">${app.name}</div>
      <div class="meta">ANDROID APP / READY TO DOWNLOAD</div>
      <a class="download" href="${app.file}" download>DOWNLOAD APP ↓</a>
    </article>
  `).join("");
}
renderApps();
</script>
</body>
</html>
